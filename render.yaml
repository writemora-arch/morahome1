# Render blueprint — one-click deploy for MORA HOME v6
services:
  - type: web
    name: mora-home
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "12"
      - key: APP_URL
        value: https://morahome.in
    disk:
      name: mora-data
      mountPath: /var/data
      sizeGB: 1
